<svg xmlns="http://www.w3.org/2000/svg" width="56" height="18" viewBox="0 0 56 18">
  <!-- Repeating lotus-bud-and-vine strip, an original motif inspired by illuminated manuscript borders. -->
  <path d="M0 9 C7 2 14 2 21 9 S35 16 42 9 S49 2 56 9" fill="none" stroke="#8A6A2F" stroke-width="1" stroke-opacity=".7"/>
  <!-- lotus bud -->
  <g transform="translate(14 9)">
    <path d="M0 -6.5 C2.6 -3.6 2.6 0 0 2.2 C-2.6 0 -2.6 -3.6 0 -6.5 Z" fill="#FF9933"/>
    <path d="M0 2.2 C3.4 1.4 5 -1.2 5.2 -3.4 C3 -2.6 1.2 -0.8 0 2.2 Z M0 2.2 C-3.4 1.4 -5 -1.2 -5.2 -3.4 C-3 -2.6 -1.2 -0.8 0 2.2 Z" fill="#E07A10" fill-opacity=".85"/>
  </g>
  <!-- leaf pair -->
  <g transform="translate(42 9)">
    <path d="M0 0 C2.5 -4.5 6 -5 7.5 -4.5 C6.5 -1.5 3.5 0.5 0 0 Z" fill="#138808" fill-opacity=".85"/>
    <path d="M0 0 C-2.5 4.5 -6 5 -7.5 4.5 C-6.5 1.5 -3.5 -0.5 0 0 Z" fill="#138808" fill-opacity=".65"/>
    <circle r="1.3" fill="#000080"/>
  </g>
  <circle cx="0" cy="9" r=".9" fill="#000080"/><circle cx="28" cy="9" r=".9" fill="#000080"/><circle cx="56" cy="9" r=".9" fill="#000080"/>
</svg>
